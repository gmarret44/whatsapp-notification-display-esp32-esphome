# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: display
  friendly_name: Display

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Display Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# --- SPI BUS ---
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

# --- PUSH BUTTON ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    name: "Screen Button"
    id: screen_button

# --- PASSIVE BUZZER ---
output:
  - platform: ledc
    pin: GPIO16
    id: buzzer_pwm

rtttl:
  output: buzzer_pwm
  id: buzzer_rtttl

button:
  - platform: template
    name: "Buzzer Notification"
    icon: "mdi:bell-ring"
    on_press:
      - rtttl.play:
          rtttl: "mario:d=4,o=5,b=100:16e6,16e6,16e6,8c6,16e6,8g6,8p,8g,8p,8c6,16p,8g,16p,8e,16p,8a,8b,16a#,8a"

# --- FONT AND ACCENTED CHARACTERS ---
font:
  - file: "gfonts://Montserrat"
    id: main_font
    size: 18
    glyphs: '!"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~ àâäéèêëîïôöùûüçÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ'

# --- IMAGE ---
image:
  - platform: file
    file: images/dark-vador.jpg
    id: img_darth_vader
    resize: 160x128
    type: RGB

# --- HOME ASSISTANT INPUTS ---
text_sensor:
  - platform: homeassistant
    id: screen_text
    entity_id: input_text.screen_text
    internal: true

  - platform: homeassistant
    id: screen_image_select
    entity_id: input_select.screen_image
    internal: true

# --- ST7735 DISPLAY ---
display:
  - platform: st7735
    model: INITR_18BLACKTAB
    cs_pin: GPIO22
    dc_pin: GPIO21
    reset_pin: GPIO19
    device_width: 128
    device_height: 160
    col_start: 0
    row_start: 0
    rotation: 90
    lambda: |-
      it.fill(Color::BLACK);

      if (id(screen_image_select).state == "Darth Vader") {
        it.image(0, 0, id(img_darth_vader));
      } else {
        // Word-wrapped text display (no word is ever cut mid-way)
        std::string text = id(screen_text).state;
        int max_len = 12; // max characters per line
        int y = 15;

        std::vector<std::string> words;
        size_t start = 0;
        while (start < text.length()) {
          size_t space_pos = text.find(' ', start);
          if (space_pos == std::string::npos) {
            words.push_back(text.substr(start));
            break;
          }
          words.push_back(text.substr(start, space_pos - start));
          start = space_pos + 1;
        }

        std::vector<std::string> lines;
        std::string current_line = "";
        for (size_t i = 0; i < words.size(); i++) {
          std::string test_line = current_line.empty() ? words[i] : current_line + " " + words[i];
          if (test_line.length() > (size_t) max_len && !current_line.empty()) {
            lines.push_back(current_line);
            current_line = words[i];
          } else {
            current_line = test_line;
          }
        }
        if (!current_line.empty()) {
          lines.push_back(current_line);
        }

        for (size_t i = 0; i < lines.size(); i++) {
          it.printf(80, y, id(main_font), Color::WHITE, TextAlign::CENTER_HORIZONTAL, "%s", lines[i].c_str());
          y += 24;
        }
      }
